# Smithery configuration for Jurisprudência TJCE
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tjce

name: tjce-mcp
displayName: "Jurisprudência TJCE"
description: >
  Pesquise jurisprudência do TJCE direto do seu agente de IA, sem a sintaxe de busca do portal. Cada acórdão vem com órgão julgador, relator, data, o trecho exato que casou a busca e o link oficial. A mesma conexão alcança outros 16 tribunais, incluindo STF, STJ e TST. Grátis, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tjce-mcp
repository: https://github.com/mcp-dir/tjce-mcp

tags:
  - tjce
  - ceara
  - jurisprudencia
  - acordaos
  - tribunal-de-justica
  - case-law
  - brazil
  - read-only
  - no-auth
  - free

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tjce

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tjce/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
